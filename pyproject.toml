[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aoe"
version = "1.1.0"
description = "Asset Orchestration Engine (AOE) - Procedural NPR Character Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
aoe = "aoe_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["aoe_cli"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aoe_ir", "aoe_ir.*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
